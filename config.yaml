# ScoutAI configuration tuned for a third-year B.Tech student seeking
# software internships, backend/full-stack roles, and core hardware/VLSI opportunities.
# Everything tunable lives here — no editing Python.
#
# Tune filters first. These deterministic rules reduce the number of jobs
# sent to the LLM screener.

filters:
  # Regexes match the job title only, case-insensitively.
  # A title must match at least one include and zero excludes.
  include_titles:
    # --- Core software engineering roles ---
    - '\b(software|backend|back-end|full[ -]?stack|web|application|platform|cloud|infrastructure|systems|distributed)\b.*\b(engineer|developer|intern|internship|trainee|apprentice)\b'
    - '\b(engineer|developer)\b.*\b(software|backend|back-end|full[ -]?stack|web|application|platform|cloud|infrastructure|systems|distributed)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - '\bswe\s+intern\b'
    - '\bsde\s+intern\b'
    - '\bsoftware development engineer\b'
    - '\bsoftware engineer\b'
    - '\bsoftware engineering intern(ship)?\b'
    - '\bsoftware development intern(ship)?\b'
    - '\bsoftware developer\b'
    - '\bbackend engineer\b'
    - '\bbackend developer\b'
    - '\bbackend intern(ship)?\b'
    - '\bback-end engineer\b'
    - '\bback-end developer\b'
    - '\bback-end intern(ship)?\b'
    - '\bfull[ -]?stack engineer\b'
    - '\bfull[ -]?stack developer\b'
    - '\bfull[ -]?stack intern(ship)?\b'
    - '\b(frontend|front-end|front end)\b.*\b(engineer|developer|intern|internship)\b'
    - '\b(engineer|developer|intern|internship)\b.*\b(frontend|front-end|front end)\b'
    - '\bfrontend intern(ship)?\b'
    - '\bfront-end intern(ship)?\b'
    - '\bweb developer\b'
    - '\bweb development intern(ship)?\b'
    - '\bweb developer intern(ship)?\b'
    - '\bapplication developer\b'
    - '\bsite reliability engineer\b'
    - '\bsre\b'
    - '\bmember of technical staff\b'

    # --- Core Hardware, VLSI, Silicon, & Verification track ---
    - '\b(rtl|digital\s+design|digital\s+ic|logic\s+design|asic|fpga|soc|silicon|hardware|dft|verification|dv|design\s+verification|physical\s+design)\b.*\b(engineer|intern|internship|trainee|apprentice|co-op)\b'
    - '\b(engineer|developer|intern|internship)\b.*\b(rtl|digital\s+design|asic|fpga|silicon|hardware|dft|verification|vlsi)\b'
    - '\b(hardware|silicon|chip|semiconductor|vlsi)\b.*\b(engineer|intern|internship|trainee)\b'
    - '\b(soc|asic|fpga|dft|eda)\s+(design\s+)?(engineer|intern|trainee)\b'
    - '\brtl\s+(design\s+)?(engineer|intern)\b'
    - '\bdigital\s+(design|ic|verification)\s+(engineer|intern)\b'
    - '\bhardware\s+(engineer|intern|internship)\b'
    - '\bsilicon\s+(design|validation|engineer|intern)\b'
    - '\bverification\s+(engineer|intern)\b'
    - '\bdesign\s+verification\s+(engineer|intern)\b'
    - '\bdft\s+(engineer|intern)\b'

    # --- Systems, Embedded & C++ track ---
    - '\bnetwork(ing)?\s+(software\s+)?engineer\b'
    - '\b(kernel|embedded|firmware|driver|packet|dataplane|data plane)\b.*\b(engineer|intern)\b'
    - '\b(performance|systems) engineer\b'
    - '\bc\+\+\b.*\b(engineer|intern)\b'
    - '\b(engineer|intern)\b.*\bc\+\+\b'

    # --- University / Internship Hiring ---
    - '\b(engineering|technology|software|developer|hardware|silicon) intern\b'
    - '\b(intern|internship)\b.*\b(software|engineering|developer|backend|back-end|full[ -]?stack|hardware|silicon|vlsi)\b'
    - '\bgraduate software engineer\b'
    - '\bgraduate hardware engineer\b'
    - '\bnew grad(uate)? (software|hardware) engineer\b'
    - '\bentry[- ]level (software|hardware) engineer\b'
    - '\bjunior (software|hardware) engineer\b'
    - '\bassociate (software|hardware) engineer\b'
    - '\bgraduate engineer trainee\b'

  # Drop senior/management and unrelated roles even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(lead|tech lead|team lead)\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(sales|account executive|marketing|recruiter|customer support|customer success)\b'
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\b(ios|android|mobile|game designer|graphic designer|product designer)\b'

  # Substrings matched against "<location> <title>", case-insensitively.
  locations:
    - india
    - bangalore
    - bengaluru
    - hyderabad
    - pune
    - gurugram
    - gurgaon
    - noida
    - delhi
    - mumbai
    - chennai
    - ahmedabad
    - jalandhar

  # Allow remote roles even if their location string lacks an Indian city.
  allow_remote: true

  # Drop postings older than this; set to null to disable.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000
score_threshold: 7.0
max_per_digest: 5

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
